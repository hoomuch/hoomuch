# Weekly update pull requests. Titles come out as Conventional Commits, e.g.
# "build(deps): bump the npm group with 3 updates", so they pass the PR title check.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let a new release age a week first, so a compromised version is usually pulled before it's
    # proposed here.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      # Minor and patch releases in one pull request; each major gets its own.
      npm:
        patterns: ['*']
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']
