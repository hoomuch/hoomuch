name: Feature request
description: Suggest a metric, a page or a setting.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        hoomuch stays read-only and stores no end-customer personal data. Ideas that need either
        can't be accepted, so it saves time to check that first.
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The question you want hoomuch to answer, or the job it makes hard today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. A sketch or a screenshot from another tool helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now
      description: A workaround, or another tool that does this.
