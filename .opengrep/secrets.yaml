# hoomuch's rules for secrets in logs and errors (CONTRIBUTING.md, "Never log secrets").
# Cases: secrets.ts. Run them with `opengrep scan --test .opengrep`.
#
# Logs go out as JSON lines: console.*(JSON.stringify({...})) or an adapter's ctx.log(event, data).
# The rules look for an expression named like a secret (apiKey, input.credentials,
# env.ENCRYPTION_KEY, row.encryptedCredentials, ...) anywhere inside one. A field name in a string,
# such as { field: 'apiKey' }, is fine.
rules:
  - id: secret-in-log
    languages: [typescript]
    severity: ERROR
    message: >-
      `$X` looks like a secret, and it reaches a log line. Never log API keys, tokens, passwords
      or encrypted blobs; log an id, a status or a message passed through sanitizeErrorText()
      (CONTRIBUTING.md, "Never log secrets").
    paths:
      include: ['/src/']
    patterns:
      - pattern-either:
          - pattern: console.$F(..., <... $X ...>, ...)
          - pattern: console[$L](..., <... $X ...>, ...)
          - pattern: $CTX.log(..., <... $X ...>, ...)
      # metavariable-regex matches from the start of the expression, hence the ^(.*\.)?.
      - metavariable-regex:
          metavariable: $X
          regex: (?i)^(.*\.)?(api_?key|secret|secret_?key|client_?secret|webhook_?secret|password|access_?token|refresh_?token|private_?key|credentials|encryption_?key|encrypted\w*|ciphertext|authorization)$

  - id: secret-in-error
    languages: [typescript]
    severity: ERROR
    message: >-
      `$X` looks like a secret, and it ends up in an error message, which can reach a log or a
      page. Say which field is wrong instead (CONTRIBUTING.md, "Never log secrets").
    paths:
      include: ['/src/']
    patterns:
      - pattern: new $ERR(..., <... $X ...>, ...)
      - metavariable-regex:
          metavariable: $ERR
          regex: ^\w*Error$
      - metavariable-regex:
          metavariable: $X
          regex: (?i)^(.*\.)?(api_?key|secret|secret_?key|client_?secret|webhook_?secret|password|access_?token|refresh_?token|private_?key|credentials|encryption_?key|encrypted\w*|ciphertext|authorization)$
